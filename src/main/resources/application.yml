server:
  port: ${SERVER_PORT:8080}

spring:
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
    consumer:
      group-id: ${SPRING_KAFKA_CONSUMER_GROUP:seckill-order-group}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
    admin:
      fail-fast: false
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      database: ${SPRING_DATA_REDIS_DATABASE:0}

mybatis:
  configuration:
    map-underscore-to-camel-case: true

app:
  instance-id: ${APP_INSTANCE:local}
  datasource:
    write:
      url: ${APP_DATASOURCE_WRITE_URL:${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/seckill?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}}
      username: ${APP_DATASOURCE_WRITE_USERNAME:${SPRING_DATASOURCE_USERNAME:root}}
      password: ${APP_DATASOURCE_WRITE_PASSWORD:${SPRING_DATASOURCE_PASSWORD:root}}
      driver-class-name: ${APP_DATASOURCE_WRITE_DRIVER_CLASS_NAME:${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}}
    read:
      url: ${APP_DATASOURCE_READ_URL:${APP_DATASOURCE_WRITE_URL:${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/seckill?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}}}
      username: ${APP_DATASOURCE_READ_USERNAME:${APP_DATASOURCE_WRITE_USERNAME:${SPRING_DATASOURCE_USERNAME:root}}}
      password: ${APP_DATASOURCE_READ_PASSWORD:${APP_DATASOURCE_WRITE_PASSWORD:${SPRING_DATASOURCE_PASSWORD:root}}}
      driver-class-name: ${APP_DATASOURCE_READ_DRIVER_CLASS_NAME:${APP_DATASOURCE_WRITE_DRIVER_CLASS_NAME:${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}}}

cache:
  product:
    ttl-seconds: ${CACHE_PRODUCT_TTL_SECONDS:300}
    null-ttl-seconds: ${CACHE_PRODUCT_NULL_TTL_SECONDS:60}
    ttl-jitter-seconds: ${CACHE_PRODUCT_TTL_JITTER_SECONDS:120}
    lock-ttl-seconds: ${CACHE_PRODUCT_LOCK_TTL_SECONDS:10}

seckill:
  topic:
    order-create: ${SECKILL_TOPIC_ORDER_CREATE:seckill-order-create}
    payment: ${SECKILL_TOPIC_PAYMENT:seckill-order-payment}
  kafka-send-timeout-seconds: ${SECKILL_KAFKA_SEND_TIMEOUT_SECONDS:5}
  order-progress-ttl-hours: ${SECKILL_ORDER_PROGRESS_TTL_HOURS:24}
  stock-load-lock-seconds: ${SECKILL_STOCK_LOAD_LOCK_SECONDS:5}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{instanceId}] %logger{36} - %msg%n"
  level:
    com.whu.distributed.seckill: debug
