services:
  mysql-master:
    image: mysql:8.0.41
    container_name: seckill-mysql-master
    command:
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --log-replica-updates=ON
      - --binlog-expire-logs-seconds=604800
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_ROOT_HOST: "%"
    ports:
      - "3307:3306"
    volumes:
      - mysql_master_data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./sql/replication-users.sql:/docker-entrypoint-initdb.d/02-replication-users.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -proot"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - seckill-net

  mysql-slave:
    image: mysql:8.0.41
    container_name: seckill-mysql-slave
    command:
      - --server-id=2
      - --relay-log=mysql-relay-bin
      - --read-only=ON
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --log-replica-updates=ON
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_ROOT_HOST: "%"
    ports:
      - "3308:3306"
    volumes:
      - mysql_slave_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -proot"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - seckill-net

  mysql-replica-init:
    image: mysql:8.0.41
    container_name: seckill-mysql-replica-init
    environment:
      MYSQL_ROOT_PASSWORD: root
      MASTER_HOST: mysql-master
      SLAVE_HOST: mysql-slave
      MYSQL_REPL_USER: repl
      MYSQL_REPL_PASSWORD: repl123
    command: ["sh", "/scripts/init-replica.sh"]
    volumes:
      - ./mysql/replica/init-replica.sh:/scripts/init-replica.sh:ro
    depends_on:
      mysql-master:
        condition: service_healthy
      mysql-slave:
        condition: service_healthy
    networks:
      - seckill-net

  redis:
    image: redis:7.4-alpine
    container_name: seckill-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - seckill-net

  kafka:
    image: bitnami/kafka:3.7
    container_name: seckill-kafka
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"
      KAFKA_KRAFT_CLUSTER_ID: abcdefghijklmnopqrstuv
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - seckill-net

  app1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: seckill-app1
    environment:
      SERVER_PORT: 8080
      APP_INSTANCE: app1
      APP_DATASOURCE_WRITE_URL: jdbc:mysql://mysql-master:3306/seckill?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      APP_DATASOURCE_WRITE_USERNAME: seckill_writer
      APP_DATASOURCE_WRITE_PASSWORD: writer123
      APP_DATASOURCE_READ_URL: jdbc:mysql://mysql-slave:3306/seckill?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      APP_DATASOURCE_READ_USERNAME: seckill_reader
      APP_DATASOURCE_READ_PASSWORD: reader123
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8081:8080"
    depends_on:
      mysql-master:
        condition: service_healthy
      mysql-slave:
        condition: service_healthy
      mysql-replica-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - seckill-net

  app2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: seckill-app2
    environment:
      SERVER_PORT: 8080
      APP_INSTANCE: app2
      APP_DATASOURCE_WRITE_URL: jdbc:mysql://mysql-master:3306/seckill?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      APP_DATASOURCE_WRITE_USERNAME: seckill_writer
      APP_DATASOURCE_WRITE_PASSWORD: writer123
      APP_DATASOURCE_READ_URL: jdbc:mysql://mysql-slave:3306/seckill?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      APP_DATASOURCE_READ_USERNAME: seckill_reader
      APP_DATASOURCE_READ_PASSWORD: reader123
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8082:8080"
    depends_on:
      mysql-master:
        condition: service_healthy
      mysql-slave:
        condition: service_healthy
      mysql-replica-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - seckill-net

  nginx:
    image: nginx:1.27-alpine
    container_name: seckill-nginx
    environment:
      NGINX_LB_POLICY: "least_conn;"
    command: >
      /bin/sh -c
      "envsubst '$$NGINX_LB_POLICY' < /etc/nginx/templates/default.conf.template
      > /etc/nginx/conf.d/default.conf
      && nginx -g 'daemon off;'"
    volumes:
      - ./nginx/conf/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/html:/usr/share/nginx/html:ro
    ports:
      - "80:80"
    depends_on:
      - app1
      - app2
    networks:
      - seckill-net

volumes:
  mysql_master_data:
  mysql_slave_data:

networks:
  seckill-net:
